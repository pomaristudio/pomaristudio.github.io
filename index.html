<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomari Studio</title>
<meta name="description" content="Pomari Studio – maker of Postcard Towers, a cozy tower-stacking game for Android.">
<style>
  :root { --bg:#f6f4ef; --fg:#1f2328; --muted:#5b6470; --accent:#d9483b; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --fg:#eceff3; --muted:#a3acb8; --card:#1d2026; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:56px 20px; }
  h1 { font-size:28px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 36px; }
  .card { background:var(--card); border-radius:16px; padding:24px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  h2 { margin:0 0 8px; font-size:22px; }
  a { color:var(--accent); }
  ul { padding-left:20px; }
  footer { color:var(--muted); font-size:14px; margin-top:40px; }
</style>
</head>
<body>
<main>
  <h1>Pomari Studio</h1>
  <p class="sub">Small, cozy games.</p>
  <div class="card">
    <h2>Postcard Towers</h2>
    <p>Drop sliding floors, stack your tower into the sky and collect postcards of famous landmarks from 8 cities.</p>
    <ul>
      <li><a href="https://play.google.com/store/apps/details?id=com.pomaristudio.postcardtowers">Google Play</a></li>
      <li><a href="https://sites.google.com/view/postcardtowers/home">Privacy policy / Gizlilik politikası</a></li>
    </ul>
  </div>
  <footer>Contact / İletişim: <a href="mailto:pomaristudio@gmail.com">pomaristudio@gmail.com</a></footer>
</main>
</body>
</html>
